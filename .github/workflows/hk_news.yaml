name: HK News Monitor

on:
  schedule:
    # HKT 08:01 → UTC 00:01 長駐job啟動（程式內跑到10:00退出）
    - cron: '1 0 * * 1-5'
    # HKT 11:02 → UTC 03:02 長駐job啟動（程式內跑到13:30退出）
    - cron: '2 3 * * 1-5'
    # HKT 15:01 → UTC 07:01 一次性
    - cron: '1 7 * * 1-5'
    # HKT 15:52 → UTC 07:52 一次性
    - cron: '52 7 * * 1-5'
    # HKT 22:01 → UTC 14:01 一次性
    - cron: '1 14 * * 1-5'

  workflow_dispatch:
    inputs:
      force_run:
        description: '強制運行（忽略週末同時間窗口，即時跑一次測試用）'
        required: false
        type: boolean
        default: false

jobs:
  news_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: hk-news-monitor
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore push cache
        uses: actions/cache@v4
        with:
          path: push_cache.json
          key: hk-news-cache-${{ github.run_id }}
          restore-keys: hk-news-cache-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run news monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          HK_NEWS_PROMPT: ${{ vars.HK_NEWS_PROMPT }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: python main.py

      - name: Save push cache
        uses: actions/cache@v4
        with:
          path: push_cache.json
          key: hk-news-cache-${{ github.run_id }}
