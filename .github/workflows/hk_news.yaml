name: HK Stock News Monitor
on:
  schedule:
    # HKT 08:00 啟動長駐Job，程式內迴圈跑到10:00自行退出 | UTC 00:00
    - cron: '0 0 * * 1-5'
    # HKT 11:00 啟動長駐Job，程式內迴圈跑到13:30自行退出 | UTC 03:00
    - cron: '0 3 * * 1-5'
    # 一次性定時執行
    - cron: '0 7 * * 1-5'   # HKT15:00
    - cron: '50 7 * * 1-5' # HKT15:50
    - cron: '0 14 * * 1-5' # HKT22:00
  workflow_dispatch:

jobs:
  news_scan:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ secrets.WORKFLOW_LOCK }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore push cache
        uses: actions/cache@v4
        with:
          path: push_cache.json
          key: hk‑news‑cache‑${{ github.run_id }}
          restore-keys: hk‑news‑cache‑

      - name: Install dependencies
        run: |
          pip install google-generativeai requests python-dateutil

      - name: Run news monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          HK_NEWS_PROMPT: ${{ vars.HK_NEWS_PROMPT }}
        run: python main.py

      - name: Save push cache
        uses: actions/cache@v4
        with:
          path: push_cache.json
          key: hk‑news‑cache‑${{ github.run_id }}
