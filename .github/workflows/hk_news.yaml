name: HK Stock News Monitor

on:
  schedule:
    # HKT 08:00 → UTC 00:00 長駐job啟動（程式內跑到10:00退出）
    - cron: '0 0 * * 1-5'
    # HKT 11:00 → UTC 03:00 長駐job啟動（程式內跑到13:30退出）
    - cron: '0 3 * * 1-5'
    # HKT 15:00 → UTC 07:00 一次性
    - cron: '0 7 * * 1-5'
    # HKT 15:50 → UTC 07:50 一次性
    - cron: '50 7 * * 1-5'
    # HKT 22:00 → UTC 14:00 一次性
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

jobs:
  news_scan:
    runs-on: ubuntu-latest
    concurrency:
      group: hk-news-monitor
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore push cache
        uses: actions/cache@v4
        with:
          path: push_cache.json
          key: hk-news-cache-${{ github.run_id }}
          restore-keys: hk-news-cache-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run news monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          HK_NEWS_PROMPT: ${{ vars.HK_NEWS_PROMPT }}
        run: python main.py

      - name: Save push cache
        uses: actions/cache@v4
        with:
          path: push_cache.json
          key: hk-news-cache-${{ github.run_id }}
