name: Y_news

on:
  schedule:
    - cron: '45 0 * * 1-5'   # HKT 08:45 (周一至周五)
    - cron: '10 4 * * 1-5'   # HKT 12:10 (周一至周五)
    - cron: '30 14 * * 1-5'  # HKT 22:30 (周一至周五)
  workflow_dispatch: # 保留手動觸發

# 並發控制：同一時間只跑一個任務，有新任務自動取消舊任務，防止重複運行/重複推送
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  scan_task:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 配置Python3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝依賴套件
        run: pip install -r requirements.txt
      - name: 讀取推送緩存（48小時去重）
        uses: actions/cache@v4
        with:
          path: push_cache.json
          key: ${{ runner.os }}-stock-bullish-cache
      - name: 執行掃描與AI分析
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          STOCK_POOL: ${{ secrets.STOCK_POOL }}
          YAHOO_RSS: ${{ secrets.YAHOO_RSS }}
        run: python main.py
      - name: 保存推送緩存
        uses: actions/cache@v4
        with:
          path: push_cache.json
          key: ${{ runner.os }}-stock-bullish-cache
